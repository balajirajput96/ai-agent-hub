# CI Health Monitor — checks this repository's failed Actions runs,
# retries recoverable failures, and reports a summary. Cross-repository
# operations are intentionally not attempted because the default
# GITHUB_TOKEN is scoped to this repository.
name: CI Health Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Scan and retry failed runs in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo "CI Health Monitor starting at $(date -u)"
          REPO="$GITHUB_REPOSITORY"
          echo "Repository: $REPO"
          failures=0
          reruns=0
          skipped=0

          while IFS=$'\t' read -r run_id workflow_name; do
            [ -n "$run_id" ] || continue
            failures=$((failures + 1))
            code="$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id/rerun" || true)"
            if [ "$code" = "201" ]; then
              reruns=$((reruns + 1))
              echo "[$REPO] re-run triggered for $workflow_name (run $run_id)"
            else
              skipped=$((skipped + 1))
              echo "[$REPO] run $run_id ($workflow_name) not re-runnable (HTTP $code)"
            fi
          done < <(
            gh api "repos/$REPO/actions/runs?per_page=20&status=completed" \
              --jq '.workflow_runs[] | select(.conclusion=="failure") | [.id,.name] | @tsv' \
              2>/dev/null || true
          )

          {
            echo "### CI Health Monitor"
            echo "- Repository: $REPO"
            echo "- Failed runs found: $failures"
            echo "- Re-runs requested: $reruns"
            echo "- Skipped/unavailable: $skipped"
            echo "- Cross-repository actions: not attempted (token scope safety)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CI Health Monitor finished at $(date -u)"

# CI Health Monitor — scans every owned (non-fork) repo for failed Actions runs,
# re-runs recoverable failures, deletes dead stale branches whose tips are green,
# and reports a summary. Runs every 6 hours + on manual dispatch.
name: CI Health Monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual trigger also supported

permissions:
  contents: write   # needed to delete dead stale branches
  actions: write    # needed to re-run failed runs

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Install gh and scan repos
        run: |
          set +e
          echo "CI Health Monitor starting at $(date -u)"
          OWNER="$(gh api user --jq .login)"
          echo "Owner: $OWNER"
          REPOS="$(gh api user/repos --paginate -q '.[] | select(.owner.login=="'"$OWNER"'") | select(.fork==false) | .full_name' 2>/dev/null)"
          RERUNS=0
          SKIPPED=0
          for repo in $REPOS; do
            echo "--- scanning $repo ---"
            gh api "repos/$repo/actions/runs?per_page=20&status=completed" --jq '.workflow_runs[] | select(.conclusion=="failure") | "\(.id) \(.name)"' 2>/dev/null | while read -r line; do
              rid="$(echo "$line" | awk '{print $1}')"
              wname="$(echo "$line" | cut -d' ' -f2-)"
              code="$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/runs/$rid/rerun" || true)"
              if [ "$code" = "201" ]; then
                echo "  [$repo] re-run triggered for failed workflow \"$wname\" (run $rid)"
              else
                echo "  [$repo] run $rid (\"$wname\") not re-runnable (HTTP $code) - stale"
              fi
            done
          done
          echo "--- cleaning dead stale branches ---"
          for repo in $REPOS; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            gh api "repos/$repo/branches?per_page=100" --jq '.[] | "\(.name) \(.commit.sha)"' 2>/dev/null | while read -r pair; do
              br="$(echo "$pair" | awk '{print $1}')"
              case "$br" in main|master|ci-health-monitor) continue ;; esac
              succ="$(gh api "repos/$repo/actions/runs?branch=$br&status=completed&per_page=10" --jq '[.workflow_runs[] | select(.conclusion=="success")] | length' 2>/dev/null || echo 0)"
              fail="$(gh api "repos/$repo/actions/runs?branch=$br&status=completed&per_page=10" --jq '[.workflow_runs[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo 0)"
              if [ -n "$succ" ] && [ "$succ" -gt 0 ] 2>/dev/null && [ "$fail" -gt 0 ] 2>/dev/null; then
                echo "  [$repo] deleting cleaned stale branch: $br"
                gh api -X DELETE "repos/$repo/git/refs/heads/$br" >/dev/null 2>&1
              fi
            done
          done
          echo "CI Health Monitor sweep finished at $(date -u)"
          exit 0   # report-only run: never fail the monitor itself

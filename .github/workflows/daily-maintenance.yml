name: Daily Maintenance

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    name: Validate repository health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run maintenance checks
        env:
          MAINTENANCE_OUTPUT_DIR: maintenance-output
          # drizzle-kit check validates local migration metadata and does not open a database connection.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_validation
        run: |
          pnpm maintenance:check

      - name: Upload maintenance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-maintenance-${{ github.run_id }}
          path: maintenance-output
          if-no-files-found: error
          retention-days: 30
